services:
  api:
    build: .
    container_name: fastapi_dev_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: fastapi_dev_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devinote}
      POSTGRES_USER: ${POSTGRES_USER:-devinote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devinote_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devinote} -d ${POSTGRES_DB:-devinote}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
